<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuition Register</title>
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one column register — dues summary up top, then tabs for Today / Classes / Payments / Teachers */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15302b; --muted:#5b6f6a; --line:#d9e1de;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --saffron:#e08a12; --good:#1f7a43; --good-soft:#dff2e5; --bad:#b4372b; --bad-soft:#fbe4e1; --neutral-soft:#eceff0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --ink:#e6efec; --muted:#93a6a1; --line:#2a3834;
  --accent:#4fc1a8; --accent-ink:#06201a; --accent-soft:#183a33;
  --saffron:#f0a440; --good:#6fd193; --good-soft:#18352455; --bad:#f08a7e; --bad-soft:#3d1e1a; --neutral-soft:#222e2b;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --ink:#e6efec; --muted:#93a6a1; --line:#2a3834;
  --accent:#4fc1a8; --accent-ink:#06201a; --accent-soft:#183a33;
  --saffron:#f0a440; --good:#6fd193; --good-soft:#18352455; --bad:#f08a7e; --bad-soft:#3d1e1a; --neutral-soft:#222e2b;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem}
h2{font-size:1.15rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav span{min-width:120px;text-align:center;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.icon{padding:6px 10px}
button.danger{color:var(--bad);border-color:var(--bad-soft)}
button:disabled{opacity:.5;cursor:not-allowed}

.due{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.due-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.due-total{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.due-total.zero{color:var(--good)}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard .name{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{display:flex;flex-direction:column}
.stats b{font-variant-numeric:tabular-nums;font-size:1rem}
.balance{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.balance b{font-family:var(--display);font-size:1.15rem}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neutral-soft);color:var(--muted);white-space:nowrap}
.pill.present{background:var(--good-soft);color:var(--good)}
.pill.absent{background:var(--bad-soft);color:var(--bad)}
.pill.rate{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--saffron)}
.panel{display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row.click{cursor:pointer}
.row.click:hover{background:var(--bg)}
.date{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.date b{font-family:var(--display);font-size:1.3rem}
.date span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row .mid{min-width:0}
.row .mid .t{font-weight:600}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.today-row{grid-template-columns:1fr auto}
.mark{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mark button{padding:7px 12px}
.mark .p{border-color:var(--good);color:var(--good)}
.mark .a{border-color:var(--bad);color:var(--bad)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{font-size:.85rem;color:var(--muted);padding:8px 12px;border-radius:8px;background:var(--neutral-soft)}
.notice.err{background:var(--bad-soft);color:var(--bad)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,20,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media(min-width:620px){.overlay{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:.82rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:9px 8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-weight:500;font-size:.9rem}
.seg input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days label{flex:1;min-width:38px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-actions .r{display:flex;gap:8px;margin-left:auto}
.hint{font-size:.8rem;color:var(--muted)}
.feebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.feebox div{display:flex;flex-direction:column;gap:2px;min-width:0}
.feebox b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.feebox .calc{grid-column:1/-1;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.backup{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.syncrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.syncrow .err{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:60}
@media (max-width:420px){.row{grid-template-columns:52px 1fr auto;gap:10px;padding:11px 12px}.due-total{font-size:1.9rem}}
@media (max-width:520px){.today-row{grid-template-columns:1fr}.today-row .mark{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label">Tuition register</div>
      <h1>Attendance &amp; fees</h1>
    </div>
    <div class="monthnav">
      <button class="icon" id="prevM" aria-label="Previous month">‹</button>
      <span id="monthLabel" class="num">—</span>
      <button class="icon" id="nextM" aria-label="Next month">›</button>
    </div>
  </header>

  <div id="status" class="notice" hidden></div>

  <section class="due" id="dueBox">
    <div class="due-head">
      <div>
        <div class="label">Total to pay now</div>
        <div class="due-total num" id="dueTotal">₹0</div>
      </div>
      <div class="small muted" id="dueSub">All classes so far, minus payments made</div>
    </div>
    <div class="tcards" id="tcards"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" id="tab-classes" aria-selected="false" data-tab="classes">Classes</button>
    <button role="tab" id="tab-payments" aria-selected="false" data-tab="payments">Payments</button>
    <button role="tab" id="tab-teachers" aria-selected="false" data-tab="teachers">Teachers &amp; rates</button>
  </nav>

  <section class="panel" id="panel"></section>

  <footer class="backup">
    <div class="syncrow">
      <div style="min-width:0"><div class="t" style="font-weight:600">Sync between phones</div><div class="small muted" id="syncStatus">Sync is off. Records are saved on this phone only.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="syncNowBtn" hidden>Sync now</button><button id="syncSetupBtn">Set up sync</button></div>
    </div>
    <div class="small muted">Backup file: keep a copy of everything (e.g. on WhatsApp or Google Drive).</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="backupBtn">Save backup</button>
      <button id="restoreBtn">Restore backup</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
  </footer>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(() => {
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const STATUS = {
  present:{label:"Attended", cls:"present", paid:true},
  absent:{label:"She was absent", cls:"absent", paid:false},
  teacher_off:{label:"Teacher on leave", cls:"", paid:false},
  holiday:{label:"Holiday", cls:"", paid:false}
};
const state = {
  teachers:[], sessions:[], payments:[],
  loaded:{teachers:false,sessions:false,payments:false},
  tab:"today", month: ym(new Date()), filterTeacher:"all",
  canWrite:true
};
let db = null;

// ---------- helpers ----------
function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayISO(){return isoDate(new Date())}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function mins(t){if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m}
function hoursOf(s,e){const a=mins(s),b=mins(e);if(a==null||b==null)return 0;let d=b-a;if(d<0)d+=1440;return d/60}
function fmtTime(t){if(!t)return"";let [h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return h+(m?":"+pad(m):"")+" "+ap}
function fmtHrs(h){const m=Math.round(h*60);const hh=Math.floor(m/60),mm=m%60;return (hh?hh+" h":"")+(hh&&mm?" ":"")+(mm?mm+" min":"")||"0 min"}
function rupee(n){const v=Math.round(n*100)/100;return "₹"+v.toLocaleString("en-IN",{maximumFractionDigits:2})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function teacherById(id){return state.teachers.find(t=>t.id===id)}
function sessionAmount(s){
  if(!STATUS[s.status]?.paid) return 0;
  const rate=Number(s.rate)||0;
  return s.payType==="hour" ? hoursOf(s.start,s.end)*rate : rate;
}
function monthLabel(m){const [y,mm]=m.split("-").map(Number);return MONTHS[mm-1]+" "+y}
function shiftMonth(m,d){const [y,mm]=m.split("-").map(Number);return ym(new Date(y,mm-1+d,1))}
function toast(msg){const h=document.getElementById("toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>h.innerHTML="",2200)}
function setStatus(msg,err){const el=document.getElementById("status");if(!msg){el.hidden=true;return}el.hidden=false;el.textContent=msg;el.className="notice"+(err?" err":"")}

// ---------- totals ----------
function teacherTotals(t){
  const all=state.sessions.filter(s=>s.teacherId===t.id);
  const earnedAll=all.reduce((a,s)=>a+sessionAmount(s),0);
  const paidAll=state.payments.filter(p=>p.teacherId===t.id).reduce((a,p)=>a+(Number(p.amount)||0),0);
  const inMonth=all.filter(s=>s.date.startsWith(state.month));
  const attended=inMonth.filter(s=>s.status==="present");
  const hrs=attended.reduce((a,s)=>a+hoursOf(s.start,s.end),0);
  const earnedMonth=inMonth.reduce((a,s)=>a+sessionAmount(s),0);
  const missed=inMonth.filter(s=>s.status==="absent").length;
  return {earnedAll,paidAll,balance:earnedAll-paidAll,attended:attended.length,hrs,earnedMonth,missed};
}

// ---------- render ----------
function render(){
  document.getElementById("monthLabel").textContent=monthLabel(state.month);
  renderDue();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  const p=document.getElementById("panel");
  if(!(state.loaded.teachers)){p.innerHTML=`<div class="empty"><span class="muted">Loading your register…</span></div>`;return}
  ({today:renderToday,classes:renderClasses,payments:renderPayments,teachers:renderTeachers})[state.tab](p);
}

function renderDue(){
  const box=document.getElementById("tcards");
  const active=state.teachers;
  let total=0;
  if(!active.length){
    box.innerHTML=`<div class="small muted">Add a teacher to start tracking classes and fees.</div>`;
    document.getElementById("dueTotal").textContent="₹0";
    document.getElementById("dueTotal").classList.add("zero");
    return;
  }
  box.innerHTML=active.map(t=>{
    const x=teacherTotals(t); total+=x.balance;
    const bal = x.balance>0.005 ? `<b class="num">${rupee(x.balance)}</b>` : x.balance<-0.005 ? `<b class="num" style="color:var(--good)">${rupee(-x.balance)} advance</b>` : `<b class="num" style="color:var(--good)">Settled</b>`;
    return `<div class="tcard">
      <div class="tcard-top"><div style="min-width:0"><div class="name">${esc(t.name)}</div><div class="small muted">${esc(t.subject||"")}</div></div>
      <span class="pill rate">${rupee(t.rate)}/${t.payType==="hour"?"hr":"day"}</span></div>
      <div class="stats">
        <div><span class="label">Classes</span><b>${x.attended}</b></div>
        <div><span class="label">${t.payType==="hour"?"Hours":"Missed"}</span><b>${t.payType==="hour"?fmtHrs(x.hrs):x.missed}</b></div>
        <div><span class="label">Fee</span><b>${rupee(x.earnedMonth)}</b></div>
      </div>
      <div class="balance"><span class="small muted">Due now</span>${bal}</div>
      <button class="ghost small" style="align-self:flex-start;padding:2px 0" data-pay="${t.id}" ${state.canWrite?"":"disabled"}>+ Record payment</button>
    </div>`;
  }).join("");
  const dt=document.getElementById("dueTotal");
  dt.textContent=rupee(Math.max(total,0)); dt.classList.toggle("zero",total<=0.005);
  document.getElementById("dueSub").textContent=`Cards show ${monthLabel(state.month)} · "Due now" covers all months`;
}

function noTeachers(p){
  p.innerHTML=`<div class="empty"><h2>Add the first teacher</h2>
  <p class="muted" style="max-width:42ch;margin:0">Enter the teacher's name and whether you pay per hour or per day. Then each day, mark attendance and enter the time the class ran.</p>
  <button class="primary" data-act="addTeacher" ${state.canWrite?"":"disabled"}>Add teacher</button></div>`;
}

function renderToday(p){
  if(!state.teachers.length) return noTeachers(p);
  const t=todayISO(), dow=new Date().getDay();
  const todays=state.sessions.filter(s=>s.date===t);
  const d=new Date(), dis=state.canWrite?"":"disabled";
  const rows=state.teachers.map(x=>{
    const done=todays.filter(s=>s.teacherId===x.id);
    const marked=done.map(s=>`<div class="small num" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">
      <span class="pill ${STATUS[s.status].cls}">${STATUS[s.status].label}</span>
      <span class="muted">${timeRange(s)}${s.start&&s.end?" ("+fmtHrs(hoursOf(s.start,s.end))+")":""}${STATUS[s.status].paid?" · "+rupee(sessionAmount(s)):""}</span>
      <button class="ghost small" style="padding:0 4px" data-edit="${s.id}">Change</button></div>`).join("");
    return `<div class="row today-row"><div class="mid"><div class="t">${esc(x.name)} <span class="muted small">${esc(x.subject||"")}</span></div>
      ${marked||`<div class="small muted">Not marked yet today</div>`}</div>
      <div class="mark"><button class="p" data-quick="present" data-t="${x.id}" ${dis}>${done.length?"+ Another class":"Attended"}</button>${done.length?"":`<button class="a" data-quick="absent" data-t="${x.id}" ${dis}>Absent</button>`}</div></div>`;
  }).join("");
  p.innerHTML=`<div class="panel-head"><div><h2>${DAYS[dow]}day, ${d.getDate()} ${MONTHS[d.getMonth()]}</h2><div class="small muted">Tap “Attended” and enter the time the class ran</div></div>
    <button data-act="addClass" ${dis}>+ Add class for another day</button></div>
    <div class="list">${rows}</div>`;
}
function timeRange(s){return s.start&&s.end?`${fmtTime(s.start)} – ${fmtTime(s.end)}`:"No time entered"}

function teacherFilterSelect(){
  return `<select id="tf" style="width:auto"><option value="all">All teachers</option>${state.teachers.map(t=>`<option value="${t.id}" ${state.filterTeacher===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`;
}

function renderClasses(p){
  if(!state.teachers.length) return noTeachers(p);
  let list=state.sessions.filter(s=>s.date.startsWith(state.month));
  if(state.filterTeacher!=="all") list=list.filter(s=>s.teacherId===state.filterTeacher);
  list.sort((a,b)=>b.date.localeCompare(a.date)||(b.start||"").localeCompare(a.start||""));
  const total=list.reduce((a,s)=>a+sessionAmount(s),0);
  const rows=list.map(s=>{const t=teacherById(s.teacherId);const d=parseISO(s.date);
    return `<div class="row click" data-edit="${s.id}" tabindex="0">
      <div class="date"><b class="num">${d.getDate()}</b><span>${DAYS[d.getDay()]}</span></div>
      <div class="mid"><div class="t">${esc(t?.name||"Removed teacher")}</div>
        <div class="small muted num">${timeRange(s)}${s.payType==="hour"&&s.start?" · "+fmtHrs(hoursOf(s.start,s.end)):""}${s.note?" · "+esc(s.note):""}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pill ${STATUS[s.status].cls}">${STATUS[s.status].label}</span><span class="amt small">${STATUS[s.status].paid?rupee(sessionAmount(s)):"—"}</span></div>
    </div>`}).join("");

// ---------- storage on this phone + sync through Google Sheet ----------
const KEY="tuition-register-v1", PKEY=KEY+"-pending", SKEY=KEY+"-sync";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
const COLLS=["teachers","sessions","payments"];
let store=(()=>{const d=lsGet(KEY,{});return {teachers:d.teachers||{},sessions:d.sessions||{},payments:d.payments||{}}})();
let pending=new Set(lsGet(PKEY,[]));
let syncCfg=lsGet(SKEY,{url:"",key:"",last:0,err:""});
const listeners={teachers:[],sessions:[],payments:[]};
function clean(v){const {_u,_d,...rest}=v;return rest}
function emit(n){const docs=Object.entries(store[n]).filter(([,v])=>!v._d).map(([id,v])=>({id,data:()=>clean(v)}));listeners[n].forEach(cb=>cb({docs,metadata:{fromCache:false}}))}
function persist(push){
  if(!lsSet(KEY,store)) throw new Error("Couldn't save on this phone. Storage may be full or blocked.");
  lsSet(PKEY,[...pending]);
  COLLS.forEach(emit);
  if(push&&syncCfg.url) scheduleSync(400);
  renderSync();
}
function touch(n,id,data,del){const u=Date.now();store[n][id]=del?{_d:true,_u:u}:{...data,_u:u};pending.add(n+"/"+id);persist(true)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
db={
  collection(n){return{add:async d=>touch(n,newId(),d),onSnapshot(cb){listeners[n].push(cb);emit(n);return()=>{}}}},
  doc(path){const [n,id]=path.split("/");return{set:async d=>touch(n,id,d),delete:async()=>touch(n,id,null,true)}}
};

let syncing=false,syncAgain=false,syncTimer=null;
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms)}
async function syncNow(){
  if(!syncCfg.url) return;
  if(syncing){syncAgain=true;return}
  syncing=true;renderSync();
  const sent=[...pending];
  const changes=sent.map(k=>{const [c,id]=k.split("/");const v=store[c]?.[id];if(!v)return null;return {c,id,u:v._u||0,d:!!v._d,data:v._d?null:clean(v)}}).filter(Boolean);
  try{
    const r=await fetch(syncCfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:syncCfg.key,changes})});
    let j;try{j=await r.json()}catch{throw new Error("The sync link didn't answer correctly. Check the link and that access is set to “Anyone”.")}
    if(!j.ok) throw new Error(j.error==="wrong key"?"Wrong sync key. Use the same key as in the Google script.":"Sync failed: "+(j.error||"unknown error"));
    for(const ch of changes){const k=ch.c+"/"+ch.id;if((store[ch.c][ch.id]?._u||0)===ch.u) pending.delete(k)}
    for(const rec of j.records||[]){
      if(!store[rec.c]) continue;
      if(pending.has(rec.c+"/"+rec.id)) continue;
      const loc=store[rec.c][rec.id];
      if(!loc||(Number(rec.u)||0)>(loc._u||0)) store[rec.c][rec.id]=rec.d?{_d:true,_u:Number(rec.u)}:{...rec.data,_u:Number(rec.u)};
    }
    syncCfg.last=Date.now();syncCfg.err="";
  }catch(e){
    syncCfg.err=navigator.onLine===false?"Offline. Changes will sync when you're back online.":(e.message||"Sync failed");
  }finally{
    syncing=false;lsSet(SKEY,syncCfg);
    try{persist(false)}catch{}
    if(syncAgain){syncAgain=false;scheduleSync(200)}
  }
}
function renderSync(){
  const el=document.getElementById("syncStatus");if(!el)return;
  document.getElementById("syncNowBtn").hidden=!syncCfg.url;
  document.getElementById("syncSetupBtn").textContent=syncCfg.url?"Sync settings":"Set up sync";
  if(!syncCfg.url){el.className="small muted";el.textContent="Sync is off. Records are saved on this phone only.";return}
  if(syncing){el.className="small muted";el.textContent="Syncing…";return}
  if(syncCfg.err){el.className="small err";el.textContent=syncCfg.err;return}
  const n=pending.size;
  el.className="small muted";
  el.textContent=(syncCfg.last?"Synced at "+new Date(syncCfg.last).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}):"Not synced yet")+(n?` · ${n} change${n>1?"s":""} waiting`:"");
}
document.getElementById("syncNowBtn").onclick=()=>syncNow();
document.getElementById("syncSetupBtn").onclick=()=>{
  openSheet(`<h2>Sync between phones</h2>
    <p class="small muted" style="margin:0">Enter the same link and key on every phone. Setup steps are in the README file (Google Sheet + script, takes about 5 minutes).</p>
    <label class="field"><span>Google script link</span><input id="f-surl" name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncCfg.url)}"></label>
    <label class="field"><span>Sync key</span><input id="f-skey" name="key" placeholder="the secret key from the script" value="${esc(syncCfg.key)}"></label>
    <div class="sheet-actions">${syncCfg.url?`<button type="button" class="danger" id="syncOff">Turn off sync</button>`:""}<div class="r"><button type="button" class="ghost" data-close>Cancel</button><button type="submit" class="primary">Save and sync</button></div></div>`,
  async fd=>{
    const url=fd.get("url").trim(),key=fd.get("key").trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error("Paste the web app link from Google Apps Script (it starts with https://script.google.com/).");
    if(!key) throw new Error("Enter the sync key.");
    const changed=url!==syncCfg.url||key!==syncCfg.key;
    syncCfg={url,key,last:changed?0:syncCfg.last,err:""};lsSet(SKEY,syncCfg);
    if(changed){COLLS.forEach(c=>Object.keys(store[c]).forEach(id=>pending.add(c+"/"+id)));lsSet(PKEY,[...pending])}
    renderSync();syncNow();toast("Sync turned on");
  });
  document.getElementById("syncOff")?.addEventListener("click",()=>{syncCfg={url:"",key:"",last:0,err:""};lsSet(SKEY,syncCfg);closeSheet();renderSync();toast("Sync turned off on this phone")});
};
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()});
window.addEventListener("online",()=>syncNow());

function start(){
  try{if(navigator.storage?.persist)navigator.storage.persist()}catch{}
  const sub=n=>db.collection(n).onSnapshot(snap=>{
    state[n]=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    state.loaded[n]=true;render();
  });
  COLLS.forEach(sub);renderSync();syncNow();
}
// ---------- backup / restore ----------
document.getElementById("backupBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"tuition-register",version:1,savedAt:new Date().toISOString(),data:store},null,2)],{type:"application/json"});

document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());const d=j.data||j;
    if(!d.teachers||!d.sessions||!d.payments) throw 0;
    const live=c=>Object.values(d[c]).filter(v=>!v._d).length;
    openSheet(`<h2>Restore backup?</h2><p class="muted" style="margin:0">This replaces all records${syncCfg.url?" on every synced phone":" on this phone"} with the backup from ${esc(j.savedAt?new Date(j.savedAt).toLocaleDateString("en-IN"):"the file")}: ${live("teachers")} teachers, ${live("sessions")} classes, ${live("payments")} payments.</p>
      <div class="sheet-actions"><div class="r"><button type="button" class="ghost" data-close>Cancel</button><button type="submit" class="primary">Replace and restore</button></div></div>`,
      async()=>{const u=Date.now();
        COLLS.forEach(c=>{
          Object.keys(store[c]).forEach(id=>{if(!d[c][id]){store[c][id]={_d:true,_u:u};pending.add(c+"/"+id)}});
          Object.entries(d[c]).forEach(([id,v])=>{store[c][id]={...v,_u:u};pending.add(c+"/"+id)});
        });
        persist(true);toast("Backup restored")});
  }catch{toast("That file isn't a tuition backup")}
};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
start();
})();
</script>
